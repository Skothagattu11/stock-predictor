# Render Blueprint — deploys the Node web app + the Python quant sidecar.
# In Render: New + > Blueprint, point at this repo/branch; it reads this file.
services:
  - type: web
    name: stock-predictor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Optional: only used for symbol search / quote fallback. Candles come
      # from Yahoo Finance and need no key. Set this in the Render dashboard
      # (Environment tab) — do NOT commit a real key.
      - key: FINNHUB_API_KEY
        sync: false
      # Explicit public URL of the sidecar. (fromService:host resolves to an
      # internal hostname Node can't reach over HTTPS -> "fetch failed", so we
      # pin the public onrender URL. Update if the sidecar's URL changes.)
      - key: QUANT_SIDECAR_URL
        value: https://quant-py.onrender.com
      # Shared secret for the TradingView/Pine alert webhook (/api/tv/webhook).
      # Set a value in the dashboard; include the same "secret" in your alert JSON.
      - key: TV_WEBHOOK_SECRET
        sync: false
      # Email alerts via Resend (resend.com). Set the API key in the dashboard;
      # ALERT_FROM_EMAIL must be a verified sender (or use onboarding@resend.dev to test).
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false

  # Python quant/ML sidecar (FastAPI). Built from its own Dockerfile.
  # plan: starter (paid) avoids sleep/cold-starts and gives more RAM than free —
  # bump to standard later when qlib/ML (Phase 9) needs more memory.
  - type: web
    name: quant-py
    runtime: docker
    plan: starter
    rootDir: services/quant-py
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: quant-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: FRED_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
