<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wealth Manager — Sign In</title>
  <style>
    :root{--bg:#070b12;--panel:#0e1522;--panel2:#111b2d;--text:#e8eef8;--muted:#95a3b8;--green:#2fd17c;--red:#ff5c6c;--blue:#5aa7ff;--line:#243149;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:radial-gradient(circle at top left,#132541 0,#070b12 42%,#05070c 100%);display:flex;align-items:center;justify-content:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--text)}
    .card{background:linear-gradient(180deg,rgba(17,27,45,.95),rgba(10,16,27,.95));border:1px solid rgba(255,255,255,.10);border-radius:22px;box-shadow:0 24px 64px rgba(0,0,0,.5);padding:40px 36px;width:100%;max-width:400px}
    .logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
    .logo-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#246bfe,#35b2ff);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
    h1{font-size:20px;font-weight:800;letter-spacing:-.03em}
    .sub{font-size:13px;color:var(--muted);margin-top:3px}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
    label{font-size:12px;color:var(--muted);font-weight:500}
    input{background:#0a1220;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 13px;font-size:14px;width:100%;outline:none;transition:.15s}
    input:focus{border-color:var(--blue)}
    .btn{width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;border:0;margin-top:4px}
    .btn-primary{background:linear-gradient(135deg,#246bfe,#35b2ff);color:#fff}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed}
    .err{background:rgba(255,92,108,.12);border:1px solid rgba(255,92,108,.3);color:#ff9aaa;border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:12px}
    .footnote{text-align:center;font-size:12px;color:var(--muted);margin-top:20px}
    .footnote a{color:var(--blue);text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">📊</div>
      <div>
        <h1>Wealth Manager</h1>
        <div class="sub">Portfolio management platform</div>
      </div>
    </div>

    <div id="errBox" class="err" style="display:none"></div>

    <form id="authForm">
      <div class="field">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Sign In</button>
    </form>

    <div class="footnote">
      Back to <a href="/">dashboard</a> &nbsp;·&nbsp; Access is by invitation only — contact your administrator
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
